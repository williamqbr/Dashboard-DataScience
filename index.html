<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShield Dashboard</title>
    <style>
      :root {
        --bg: #09131d;
        --bg-soft: #111f2d;
        --panel: #122435;
        --panel-2: #17314a;
        --line: rgba(148, 163, 184, 0.15);
        --text: #ecf8ff;
        --muted: #9bb5ca;
        --cyan: #45d0ff;
        --green: #32d9a0;
        --yellow: #f5c451;
        --red: #ff6b6b;
        --purple: #9a7dff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #050d14 0%, #09131d 100%);
        color: var(--text);
      }

      .page {
        max-width: 1440px;
        margin: 0 auto;
        padding: 24px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 22px;
        padding: 18px 22px;
        background: rgba(18, 36, 53, 0.8);
        border: 1px solid var(--line);
        border-radius: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--cyan), var(--green));
        display: grid;
        place-items: center;
        color: #041018;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 1.45rem;
      }

      .subhead {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .filters {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      select {
        background: var(--bg-soft);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        min-width: 140px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(6, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }

      .card {
        background: rgba(18, 36, 53, 0.88);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 14px 24px rgba(0, 0, 0, 0.18);
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .stat-value {
        margin-top: 12px;
        font-size: clamp(1.6rem, 2vw, 2.3rem);
        font-weight: 700;
      }

      .stat-trend {
        color: var(--green);
        margin-top: 8px;
        font-size: 0.8rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.7fr 0.9fr 1fr;
        gap: 18px;
      }

      .panel {
        background: rgba(18, 36, 53, 0.88);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }

      .panel h2 {
        margin: 0 0 16px;
        font-size: 1rem;
      }

      .line-chart {
        width: 100%;
        height: 260px;
        background: rgba(8, 18, 28, 0.5);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }

      .area-chart {
        width: 100%;
        height: 160px;
      }

      .donut-wrap {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .donut {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: conic-gradient(var(--red) 0 35%, var(--yellow) 35% 65%, var(--green) 65% 90%, var(--cyan) 90% 100%);
        position: relative;
      }

      .donut::before {
        content: "";
        position: absolute;
        inset: 19px;
        background: #122435;
        border-radius: 50%;
      }

      .donut-center {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 700;
        z-index: 1;
      }

      .legend {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }

      .legend li {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .bar-list {
        display: grid;
        gap: 12px;
      }

      .bar-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .bar-name {
        flex: 1;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .bar-track {
        flex: 2;
        height: 12px;
        background: rgba(148, 163, 184, 0.12);
        border-radius: 999px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--green));
      }

      .bar-value {
        min-width: 34px;
        text-align: right;
        color: var(--text);
        font-weight: 600;
      }

      .recent-table {
        width: 100%;
        border-collapse: collapse;
      }

      .recent-table th,
      .recent-table td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 0.8rem;
      }

      .pill {
        display: inline-block;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .severity-critica { background: rgba(255, 107, 107, 0.15); color: #ff9d9d; }
      .severity-alta { background: rgba(245, 196, 81, 0.14); color: #f7d673; }
      .severity-media { background: rgba(69, 208, 255, 0.15); color: #8fe6ff; }
      .severity-baixa { background: rgba(50, 217, 160, 0.14); color: #9af4d0; }

      .glass {
        background: rgba(9, 19, 29, 0.5);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      @media (max-width: 1100px) {
        .stats { grid-template-columns: repeat(3, minmax(180px, 1fr)); }
        .grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 640px) {
        .stats { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
        .header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div>
            <h1>CyberShield Dashboard</h1>
            <div class="subhead">Monitoramento operacional de segurança cibernética</div>
          </div>
        </div>

        <div class="filters">
          <select id="sectorFilter">
            <option value="all">Todos os setores</option>
          </select>
          <select id="severityFilter">
            <option value="all">Todas as severidades</option>
            <option value="Crítica">Crítica</option>
            <option value="Alta">Alta</option>
            <option value="Média">Média</option>
            <option value="Baixa">Baixa</option>
          </select>
          <select id="regionFilter">
            <option value="all">Todas as regiões</option>
          </select>
        </div>
      </header>

      <section class="stats" id="statsGrid"></section>

      <section class="grid">
        <div class="panel">
          <h2>Incidentes por mês</h2>
          <div class="line-chart" id="monthlyChart"></div>
        </div>

        <div class="panel">
          <h2>Severidade</h2>
          <div class="donut-wrap">
            <div class="donut" id="donutChart">
              <div class="donut-center">%</div>
            </div>
            <ul class="legend" id="severityLegend"></ul>
          </div>
        </div>

        <div class="panel">
          <h2>Top vetores de ataque</h2>
          <div class="bar-list" id="vectorBars"></div>
        </div>

        <div class="panel">
          <h2>Regiões com maior volume</h2>
          <div class="bar-list" id="regionBars"></div>
        </div>

        <div class="panel">
          <h2>Setores monitorados</h2>
          <div class="bar-list" id="sectorBars"></div>
        </div>

        <div class="panel">
          <h2>Eventos recentes</h2>
          <table class="recent-table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Setor</th>
                <th>Ameaça</th>
                <th>Sever.</th>
              </tr>
            </thead>
            <tbody id="recentRows"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      const defaultMetrics = [
        { label: 'Incidentes', key: 'incidents', suffix: '' },
        { label: 'Custo médio', key: 'avg_cost', prefix: 'R$ ', digits: 2 },
        { label: 'MTTR (h)', key: 'mttr', suffix: 'h' },
        { label: 'Ativos afetados', key: 'avg_assets', suffix: '' },
        { label: 'Críticos', key: 'critical_share', suffix: '%' },
        { label: 'SLA', key: 'sla', suffix: '%' },
      ];

      function formatNumber(value, digits = 0) {
        return Number(value).toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
      }

      function renderStats(data) {
        const statsGrid = document.getElementById('statsGrid');
        statsGrid.innerHTML = defaultMetrics.map((metric) => {
          const value = data.totals[metric.key];
          const prefix = metric.prefix || '';
          const suffix = metric.suffix || '';
          const num = typeof value === 'number' ? value : 0;
          const display = metric.digits ? formatNumber(num, metric.digits) : formatNumber(num, 0);
          return `
            <div class="card">
              <div class="stat-label">${metric.label}</div>
              <div class="stat-value">${prefix}${display}${suffix}</div>
              <div class="stat-trend">+ indicadores em tempo real</div>
            </div>
          `;
        }).join('');
      }

      function renderMonthlyLine(data) {
        const chart = document.getElementById('monthlyChart');
        const points = data.monthly || [];
        const max = Math.max(...points.map(p => p.incidents), 1);
        const width = 640;
        const height = 210;
        const padding = 24;

        const coords = points.map((point, index) => {
          const x = padding + (index * (width - padding * 2)) / Math.max(points.length - 1, 1);
          const y = height - padding - (point.incidents / max) * (height - padding * 2);
          return `${x},${y}`;
        }).join(' ');

        const area = `${coords} ${width - padding},${height - padding} ${padding},${height - padding}`;

        chart.innerHTML = `
          <svg viewBox="0 0 ${width} ${height}" width="100%" height="100%" preserveAspectRatio="none">
            <defs>
              <linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#45d0ff" stop-opacity="0.45"/>
                <stop offset="100%" stop-color="#45d0ff" stop-opacity="0.03"/>
              </linearGradient>
            </defs>
            <g>
              ${Array.from({ length: 4 }).map((_, idx) => {
                const y = padding + (idx * (height - padding * 2)) / 3;
                return `<line x1="${padding}" y1="${y}" x2="${width - padding}" y2="${y}" stroke="rgba(148,163,184,0.18)" stroke-dasharray="4 4" />`;
              }).join('')}
              <polygon points="${area}" fill="url(#areaFill)" />
              <polyline points="${coords}" fill="none" stroke="#45d0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
              ${points.map((point, index) => {
                const x = padding + (index * (width - padding * 2)) / Math.max(points.length - 1, 1);
                const y = height - padding - (point.incidents / max) * (height - padding * 2);
                return `<circle cx="${x}" cy="${y}" r="4" fill="#32d9a0" />`;
              }).join('')}
            </g>
          </svg>
        `;
      }

      function renderSeverity(data) {
        const severity = data.severity || [];
        const total = severity.reduce((sum, item) => sum + Number(item.value || 0), 0) || 1;
        const segments = [];
        let current = 0;
        const colors = {
          'Crítica': '#ff6b6b',
          'Alta': '#f5c451',
          'Média': '#45d0ff',
          'Baixa': '#32d9a0',
        };

        severity.forEach((item) => {
          const percent = (Number(item.value || 0) / total) * 100;
          const start = current;
          current += percent;
          segments.push(`${colors[item.name] || '#45d0ff'} ${start}% ${current}%`);
        });

        document.getElementById('donutChart').style.background = `conic-gradient(${segments.join(', ')})`;
        document.getElementById('donutChart').querySelector('.donut-center').textContent = `${Math.round((severity.find(i => i.name === 'Crítica')?.value || 0) / total * 100)}%`;

        const legend = document.getElementById('severityLegend');
        legend.innerHTML = severity.map((item) => `
          <li>
            <span class="dot" style="background:${colors[item.name] || '#45d0ff'}"></span>
            ${item.name} · ${item.value}
          </li>
        `).join('');
      }

      function renderBars(targetId, items, formatter = null) {
        const container = document.getElementById(targetId);
        const maxValue = Math.max(...items.map(item => Number(item.value || 0)), 1);
        container.innerHTML = items.map((item) => {
          const percent = (Number(item.value || 0) / maxValue) * 100;
          const value = formatter ? formatter(item.value) : item.value;
          return `
            <div class="bar-row">
              <div class="bar-name">${item.name}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${percent}%"></div></div>
              <div class="bar-value">${value}</div>
            </div>
          `;
        }).join('');
      }

      function renderRecent(data) {
        const rows = document.getElementById('recentRows');
        rows.innerHTML = (data.recent || []).map((item) => {
          const badge = `severity-${item.severity.toLowerCase()}`;
          return `
            <tr>
              <td>${item.event_date}</td>
              <td>${item.sector}</td>
              <td>${item.threat_type}</td>
              <td><span class="pill ${badge}">${item.severity}</span></td>
            </tr>
          `;
        }).join('');
      }

      function hydrateFilters(data) {
        const sectorSelect = document.getElementById('sectorFilter');
        const regionSelect = document.getElementById('regionFilter');

        const sectorOptions = [...new Set((data.sectors || []).map(item => item.name))];
        const regionOptions = [...new Set((data.regions || []).map(item => item.name))];

        sectorSelect.innerHTML = '<option value="all">Todos os setores</option>' + sectorOptions.map((item) => `<option value="${item}">${item}</option>`).join('');
        regionSelect.innerHTML = '<option value="all">Todas as regiões</option>' + regionOptions.map((item) => `<option value="${item}">${item}</option>`).join('');
      }

      async function loadDashboard() {
        const params = new URLSearchParams(window.location.search);
        const sector = params.get('sector') || 'all';
        const severity = params.get('severity') || 'all';
        const region = params.get('region') || 'all';

        const qs = new URLSearchParams({ sector, severity, region });
        const response = await fetch(`/api/dashboard?${qs.toString()}`);
        const data = await response.json();

        renderStats(data);
        renderMonthlyLine(data);
        renderSeverity(data);
        renderBars('vectorBars', data.vectors || []);
        renderBars('regionBars', data.regions || []);
        renderBars('sectorBars', data.sectors || [], (v) => `${v}`);
        renderRecent(data);
        hydrateFilters(data);

        document.getElementById('sectorFilter').value = sector;
        document.getElementById('severityFilter').value = severity;
        document.getElementById('regionFilter').value = region;
      }

      function bindFilters() {
        ['sectorFilter', 'severityFilter', 'regionFilter'].forEach((id) => {
          document.getElementById(id).addEventListener('change', () => {
            const params = new URLSearchParams();
            params.set('sector', document.getElementById('sectorFilter').value || 'all');
            params.set('severity', document.getElementById('severityFilter').value || 'all');
            params.set('region', document.getElementById('regionFilter').value || 'all');
            history.replaceState({}, '', `${location.pathname}?${params}`);
            loadDashboard();
          });
        });
      }

      bindFilters();
      loadDashboard();
    </script>
  </body>
</html>
